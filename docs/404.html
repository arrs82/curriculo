<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Página não Encontrada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PT Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f8f8;
        }

        .error-container {
            text-align: center;
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        .error-container h1 {
            font-size: 150px;
            font-weight: bold;
            color: #ff6f61;
        }

        .error-container h2 {
            font-size: 24px;
            color: #333;
            margin: 10px 0;
        }

        .error-container p {
            color: #777;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .error-container a {
            text-decoration: none;
            color: #fff;
            background-color: #ff6f61;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }

        .error-container a:hover {
            background-color: #ff3d2e;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Ops! Página não encontrada</h2>
        <p>A página que você está procurando não existe.</p>
        <a href="/">Voltar para a Página Inicial</a>
    </div>
</body>
</html>
