<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Gorillas QBasic</title>
  
  <style type="text/css">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #canvas-holder {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      border: 0;
      background: #000;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      margin: 0;
      padding: 0;
    }

    canvas:focus {
      outline: none;
    }
  </style>

  <!-- Scripts do jogo -->
  <script type="text/javascript" src="./gorilla_files/ega8x14.js.download"></script>
  <script type="text/javascript" src="./gorilla_files/gorilla.js.download"></script>
</head>

<body>
  <div id="canvas-holder">
    <canvas id="canvas" width="960" height="525" tabindex="1"></canvas>
  </div>
</body>
</html>

<button id="fullscreen-btn" style="
  position: absolute;
  bottom: 10px;
  right: 10px;
  z-index: 1000;
  padding: 10px 20px;
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  background: rgba(0,0,0,0.5);
  border: 2px solid #fff;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
">
  Tela Cheia
</button>

<script>
  const canvasHolder = document.getElementById('canvas-holder');
  const canvas = document.getElementById('canvas');
  const btn = document.getElementById('fullscreen-btn');

  // Detecta mobile
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  // Cria input invisível, mas focável
  let hiddenInput = document.createElement('input');
  hiddenInput.type = 'text';
  hiddenInput.style.position = 'absolute';
  hiddenInput.style.opacity = 0.1;  // quase invisível
  hiddenInput.style.width = '1px';
  hiddenInput.style.height = '1px';
  hiddenInput.style.bottom = '0';
  hiddenInput.style.left = '0';
  canvasHolder.appendChild(hiddenInput);

  btn.addEventListener('click', () => {
    // Tenta fullscreen em qualquer navegador que suporte
    if (canvasHolder.requestFullscreen) canvasHolder.requestFullscreen();
    else if (canvasHolder.webkitRequestFullscreen) canvasHolder.webkitRequestFullscreen();
    else if (canvasHolder.msRequestFullscreen) canvasHolder.msRequestFullscreen();

    // Força foco no input em mobile para abrir teclado
    if (isMobile) hiddenInput.focus();
  });

  // Mantém proporção 16:9
  function resizeCanvasHolder() {
    const w = canvasHolder.clientWidth;
    canvasHolder.style.height = (w * 9 / 16) + 'px';
  }
  window.addEventListener('resize', resizeCanvasHolder);
  window.addEventListener('load', resizeCanvasHolder);

  // Redireciona teclado do input para o canvas
  hiddenInput.addEventListener('keydown', e => canvas.dispatchEvent(new KeyboardEvent('keydown', e)));
  hiddenInput.addEventListener('keyup', e => canvas.dispatchEvent(new KeyboardEvent('keyup', e)));
</script>
