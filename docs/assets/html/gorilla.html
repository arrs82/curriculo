<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Gorillas QBasic</title>
  
  <style type="text/css">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #canvas-holder {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      border: 0;
      background: #000;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      margin: 0;
      padding: 0;
    }

    canvas:focus {
      outline: none;
    }
  </style>

  <!-- Scripts do jogo -->
  <script type="text/javascript" src="./gorilla_files/ega8x14.js.download"></script>
  <script type="text/javascript" src="./gorilla_files/gorilla.js.download"></script>
</head>

<body>
  <div id="canvas-holder">
    <canvas id="canvas" width="960" height="525" tabindex="1"></canvas>
  </div>
</body>
</html>

<button id="fullscreen-btn" style="
  position: absolute;
  bottom: 10px;
  right: 10px;
  z-index: 1000;
  padding: 10px 20px;
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  background: rgba(0,0,0,0.5);
  border: 2px solid #fff;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
">
  Tela Cheia
</button>

<script>
  const canvasHolder = document.getElementById('canvas-holder');
  const canvas = document.getElementById('canvas');
  const btn = document.getElementById('fullscreen-btn');

  // Input invisível para abrir teclado em mobile
  let hiddenInput = document.getElementById('hidden-input');
  if(!hiddenInput){
    hiddenInput = document.createElement('input');
    hiddenInput.type = 'text';
    hiddenInput.style.position = 'absolute';
    hiddenInput.style.opacity = 0;
    hiddenInput.style.pointerEvents = 'none';
    hiddenInput.style.width = '0';
    hiddenInput.style.height = '0';
    canvasHolder.appendChild(hiddenInput);
  }

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }

  btn.addEventListener('click', () => {
    if (!isIOS()) {
      if (canvasHolder.requestFullscreen) canvasHolder.requestFullscreen();
      else if (canvasHolder.webkitRequestFullscreen) canvasHolder.webkitRequestFullscreen();
      else if (canvasHolder.msRequestFullscreen) canvasHolder.msRequestFullscreen();
      hiddenInput.focus(); // mostra teclado em mobile
    } else {
      hiddenInput.focus(); // iOS mobile foca input para teclado
    }
  });

  // Mantém proporção 16:9
  function resizeCanvasHolder() {
    const w = canvasHolder.clientWidth;
    canvasHolder.style.height = (w * 9 / 16) + 'px';
  }
  window.addEventListener('resize', resizeCanvasHolder);
  window.addEventListener('load', resizeCanvasHolder);

  // Captura teclado para o canvas
  hiddenInput.addEventListener('keydown', e => canvas.dispatchEvent(new KeyboardEvent('keydown', e)));
  hiddenInput.addEventListener('keyup', e => canvas.dispatchEvent(new KeyboardEvent('keyup', e)));
</script>
